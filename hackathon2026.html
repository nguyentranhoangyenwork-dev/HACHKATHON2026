const AR=[['Việt Nam là xứ sở của nền văn minh lúa nước: nhịp sống làng quê từ lâu gắn với mùa gieo, mùa gặt và những dịp lễ hội sau vụ mùa.','Khi đến nông trại, bạn không chỉ thấy cảnh đẹp mà còn thấy cách người dân chăm đất, giữ giống và chia sẻ công việc theo mùa. Mỗi vùng có cách làm riêng, tạo nên bản sắc nông nghiệp khác nhau.','Hãy đi chậm, hỏi người dân về công việc của họ và tôn trọng quy định của từng nông trại. Đó là cách đơn giản nhất để hiểu văn hóa nông nghiệp.'],

['Chuẩn bị giày thoải mái, mũ nón, áo mưa mỏng và nước uống.','Nếu bạn dị ứng thực phẩm (như dâu, các loại hạt, sữa), hãy báo trước cho đơn vị tổ chức.','Chọn phương tiện đến điểm du lịch (máy bay, tàu hỏa, xe bus hoặc xe cá nhân) và đặt vé sớm. Farm2hand chưa kết nối API vé nên bạn tự đặt vé.','Đến đúng khung giờ nhận khách mà nông trại đã mở.'],

const PINFO=[['Miến dong','Sản phẩm chế biến từ tinh bột củ dong, dạng sợi khô.','Nấu canh, xào, trộn.','Đây là sản phẩm chế biến, không phải nông sản tươi.'],['Cây dong','Cây cho củ dùng lấy tinh bột; cần phân biệt với miến dong là sản phẩm chế biến.','Tinh bột dùng trong nấu ăn.','Miến dong.'],['Dứa','Quả vỏ có mắt, ruột vàng, vị chua ngọt và thơm; thường trồng trên đồi đất thoát nước tốt.','Ăn tươi, nấu canh chua, xào, làm nước ép.','Nước ép dứa, dứa sấy, mứt dứa.'],['Cà phê','Cây công nghiệp cho quả chín đỏ; nhân hạt được sơ chế, phơi hoặc sấy rồi rang để pha uống. Việt Nam trồng chủ yếu cà phê vối (robusta) và một phần cà phê chè (arabica).','Pha phin, pha máy, làm đồ uống và món tráng miệng.','Cà phê rang xay, cà phê hòa tan và các sản phẩm từ cà phê.'],['Hồ tiêu','Cây leo cho chùm quả nhỏ; quả được thu hoạch rồi phơi sấy, vị cay nồng và thơm đặc trưng.','Gia vị ướp, nêm nếm món mặn.','Tiêu đen, tiêu trắng, tiêu xay.'],['Tỏi','Củ có nhiều tép, mùi hăng đặc trưng; tỏi Lý Sơn là sản phẩm trọng tâm của chương trình. Điều kiện đất đai, cách trồng, thu hoạch và bảo quản sẽ được bổ sung khi có nguồn đáng tin cậy.','Gia vị, ướp, phi thơm, muối chua.','Tỏi khô, tỏi phi và các sản phẩm thực phẩm từ tỏi, tùy cơ sở sản xuất.'],['Hạt sen','Hạt của cây sen, vị bùi nhẹ; thường tách vỏ và bỏ tim sen trước khi nấu.','Nấu chè, hầm, nấu cháo và các món ăn nhẹ.','Trà sen, hạt sen sấy, nguyên liệu chế biến món ăn.'],['Trái vả','Quả vả hình tròn dẹt. Chưa khẳng định đây là đặc sản riêng của Huế.','Dùng trong các món ăn địa phương và chế biến thực phẩm.','Mứt hoặc sản phẩm sấy, tùy cơ sở chế biến.'],['Hạt điều','Hạt nằm ngoài quả điều; nhân hạt cần xử lý cẩn thận khi chế biến. Chưa khẳng định nguồn gốc riêng của Huế. Hạt điều có thể gây dị ứng ở một số người.','Ăn sau khi rang, làm nguyên liệu bánh và món ăn.','Hạt điều rang muối, hạt điều tách vỏ.'],['Cao su','Cây công nghiệp lấy mủ từ thân cây để sản xuất cao su thiên nhiên; không phải thực phẩm. Không tự ý chạm vào mủ hoặc hóa chất trong quá trình chế biến.','Không dùng làm thực phẩm.','Ứng dụng công nghiệp: lốp xe, găng tay, đế giày và các vật liệu khác.'],['Dừa','Cây ăn quả, nước dừa và cơm dừa dùng cho nhiều món ăn.','Uống nước dừa, nấu ăn, làm bánh kẹo.','Kẹo dừa, dầu dừa.'],['Chè','Cây chè được hái búp và lá non để chế biến trà.','Pha trà.','Trà xanh và các loại trà đóng gói.'],['Dâu tây','Quả mọng đỏ, vị chua ngọt, trồng ở vùng khí hậu mát. Có thể gây dị ứng ở một số người.','Ăn tươi, làm sinh tố, mứt.','Mứt dâu, dâu sấy.'],['Lạc đỏ','Củ lạc (đậu phộng) có vỏ lụa đỏ. Lạc có thể gây dị ứng nghiêm trọng ở một số người.','Rang, luộc, nấu ăn.','Dầu lạc, kẹo lạc.'],['Măng','Chồi non của tre, nứa; cần sơ chế kỹ trước khi nấu.','Luộc, xào, nấu canh.','Măng khô, măng muối chua.'],['Mắc khén','Gia vị hạt có mùi thơm đặc trưng của ẩm thực Tây Bắc.','Ướp và nêm nếm món nướng.','Hạt mắc khén xay.'],['Hạt dổi','Gia vị hạt có mùi thơm của ẩm thực vùng cao. Ảnh nguồn cần xác minh.','Ướp thịt, nêm nếm.','Hạt dổi xay.'],['Dưa vàng','Quả dưa ruột vàng, vị ngọt thơm.','Ăn tươi, làm sinh tố.','Nước ép.'],['Bưởi','Quả to, múi mọng, vị ngọt chua nhẹ.','Ăn tươi, làm gỏi.','Mứt vỏ bưởi, nước ép.'],['Nhãn','Quả nhỏ, cùi trắng, vị ngọt thơm.','Ăn tươi, nấu chè.','Nhãn sấy.'],['Cây thuốc lá','Cây công nghiệp, không phải thực phẩm. Farm2hand không khuyến khích sử dụng thuốc lá.','Không dùng làm thực phẩm.','Không giới thiệu sản phẩm chế biến.']];

['Quy trình: khách chọn tour, chọn ngày khởi hành, chọn số lượng người, cung cấp thông tin liên hệ, kiểm tra giá và phụ phí, đọc và đồng ý điều khoản, thanh toán theo phương thức được hỗ trợ, hệ thống xác nhận sau khi nhận kết quả thanh toán hợp lệ, rồi khách nhận thông tin xác nhận và hướng dẫn chuẩn bị chuyến đi.','Pending: yêu cầu đặt chỗ đang chờ xử lý, chưa bảo đảm chỗ. Confirmed: chỉ khi hệ thống hoặc nông trại xác nhận hợp lệ. Completed: chuyến đi đã hoàn thành. Cancelled: booking đã hủy.','Mỗi khách không thể đặt hai tour có thời gian giao nhau; hệ thống cảnh báo và không cho xác nhận khi lịch trùng.'],
['Hiện chỉ có mã QR mô phỏng để thử nghiệm, không có giao dịch thật. Khi tích hợp cổng thanh toán, trạng thái đã thanh toán chỉ hiển thị sau khi nhận xác nhận từ hệ thống thanh toán.','Vé di chuyển và dịch vụ bên thứ ba do khách tự đặt không thu qua Farm2hand, trừ khi được ghi rõ trước khi thanh toán.'],
['Mức phí hủy được hiển thị trước khi bạn xác nhận đặt tour. Phí tính trên giá trị tour; chi phí đã phát sinh với bên thứ ba không hoàn lại.','TABLE','Không đến đúng giờ hoặc không tham gia tour: tính như hủy trong ngày (100%).','Bất khả kháng (thời tiết xấu, thiên tai, quyết định của cơ quan chức năng): đổi lịch, bảo lưu hoặc hoàn tiền trừ chi phí thực tế đã phát sinh.','Hoàn tiền: dự kiến xử lý trong 7–14 ngày làm việc kể từ khi yêu cầu hủy hợp lệ được xác nhận (dự kiến, cần xác nhận khi vận hành).'],
['Đổi ngày: được đổi miễn phí một lần nếu yêu cầu trước ngày khởi hành ít nhất 7 ngày và còn chỗ; sau mốc này tính như hủy.','Đổi người tham gia: được phép trước ngày khởi hành ít nhất 3 ngày, kèm thông tin người mới.','Đổi tour: tính chênh lệch giá nếu có và tuân theo quy định đổi ngày.'],

['Gửi khiếu nại qua email nguyentranhoangyenwork@gmail.com hoặc hotline 0375406195, kèm mã booking và mô tả vấn đề.','Farm2hand xác nhận đã nhận khiếu nại, kiểm tra thông tin với các bên liên quan và phản hồi hướng xử lý (dự kiến trong 3–5 ngày làm việc, cần xác nhận khi vận hành).'],
['Chốt danh sách khách trước ngày khởi hành theo yêu cầu của nhà cung cấp vận chuyển (thời điểm cụ thể cần xác nhận).','Lịch có thể thay đổi do thời tiết, sóng lớn hoặc cơ quan chức năng. Nếu tàu hoặc phà không thể khởi hành: đổi lịch, bảo lưu hoặc hoàn tiền trừ chi phí thực tế đã phát sinh.','Các khoản phí vận chuyển nằm ngoài giá tour cơ bản được thông báo trước khi xác nhận. Khách nên chuẩn bị trước cho nguy cơ say sóng và báo trước nếu có tiền sử say sóng nặng.']];
